<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习 Rust</title>
    <script src="../marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            line-height: 1.8;
        }
        .bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://dl.rhythmarchive.top/objects/a0b3a1340879a896f3d1b609f064d13f11499ed059b72d3aada946da79ef46e7/webp');
            background-size: cover; background-position: center;
            filter: blur(12px); transform: scale(1.1); z-index: -1;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            max-width: 800px; width: 100%;
            padding: 40px 50px;
            position: relative; z-index: 1;
        }
        .markdown-body h1 { font-size: 1.9rem; margin-bottom: 16px; border-bottom: 2px solid #eee; padding-bottom: 12px; }
        .markdown-body p { margin-bottom: 14px; }
        .markdown-body ul { padding-left: 24px; margin-bottom: 14px; }
        .markdown-body blockquote { border-left: 4px solid #4a90d9; background: #f7f9fc; padding: 12px 16px; margin: 16px 0; border-radius: 6px; color: #555; }
        .back { display: inline-block; margin-bottom: 20px; color: #4a90d9; text-decoration: none; font-size: .9rem; }
        .back:hover { color: #2a6bb8; }
        @media (max-width: 600px) { body { padding: 15px; } .card { padding: 24px 20px; } }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="card">
        <a class="back" href="/myblog/">← 返回博客主页</a>
        <div id="content" class="markdown-body"></div>
    </div>

    <script>
        // 用 Markdown 写这篇内容
        const markdownText = `
# 📘 学习 Rust

在这里写下你的 Rust 学习笔记。

## 今日进度
- [x] 变量与类型
- [x] 所有权与借用
- [ ] 生命周期
- [ ] 并发

## 笔记摘录
> 当你还在犹豫时，别人已经在编译了。

一步步来，加油！
        `;
        document.getElementById('content').innerHTML = marked.parse(markdownText);
    </script>
</body>
</html>
