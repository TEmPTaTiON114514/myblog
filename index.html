<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <!-- 引入本地 marked.js -->
    <script src="marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 高斯模糊背景 -->
    <div class="bg"></div>

    <div class="layout">

        <!-- 左侧：事情侧边栏 -->
        <aside class="sidebar">
            <h2 class="sidebar-title">📌 我的事情</h2>
            <ul class="todo-list">
                <li class="todo-item">
                    <a class="todo-link" href="/myblog/study-rust/">
                        <span class="todo-dot"></span>
                        <div><strong>学习 Rust</strong><p>每天刷一点 LeetCode</p></div>
                    </a>
                </li>
                <li class="todo-item">
                    <a class="todo-link" href="/myblog/fitness/">
                        <span class="todo-dot"></span>
                        <div><strong>健身</strong><p>每周三次，跑步 + 力量</p></div>
                    </a>
                </li>
                <li class="todo-item">
                    <a class="todo-link" href="/myblog/blog-writing/">
                        <span class="todo-dot"></span>
                        <div><strong>写博客</strong><p>每周更新一篇技术文</p></div>
                    </a>
                </li>
                <li class="todo-item">
                    <a class="todo-link" href="/myblog/reading/">
                        <span class="todo-dot"></span>
                        <div><strong>读书</strong><p>本月目标：读完 2 本</p></div>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 右侧：Markdown 正文 -->
        <main class="blog-card">
            <div id="content" class="markdown-body"></div>
        </main>

    </div>

    <script>
        // 博客正文，用 Markdown 写
        const markdownText = `
# 欢迎来到我的博客 👋

这是我的 **个人博客**，用 Markdown + marked.js 渲染。

---

## 关于我
- 🌱 热爱编程与技术
- 🎨 喜欢设计与创作
- 📚 持续学习

## 技术栈
| 前端 | 后端 |
|------|------|
| HTML/CSS | Node.js |
| JavaScript | Python |

> **座右铭**：行动是成功的开始。

© 2026 我的博客
        `;
        document.getElementById('content').innerHTML = marked.parse(markdownText);
    </script>

</body>
</html>
